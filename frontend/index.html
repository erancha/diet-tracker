<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מעקב תזונה</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>שאלון תזונה יומי</h1>
    <span id="user-email"></span>
  </header>
  <main>
    <div id="alerts"></div>
    <div id="trend" class="trend" dir="ltr" hidden></div>
    <div id="day-picker" class="day-picker"></div>
    <form id="questionnaire"></form>
    <button id="submit" type="button">שליחה</button>
    <section>
      <h2>היסטוריה</h2>
      <div class="table-wrap"><table id="history"></table></div>
    </section>
  </main>
  <div id="trend-tooltip" class="trend-tooltip" hidden></div>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
