AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: diet-tracker - API, storage, nudge scheduling, and frontend hosting.

Parameters:
  UserPoolId:
    Type: String
  UserPoolClientId:
    Type: String
  SesSender:
    Type: String
    Description: Verified SES identity used as the From address
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: 'http://localhost:8000'
  ReminderHours:
    Type: String
    Description: Asia/Jerusalem hours of the daily fill reminders, whole hours only, passed by
      scripts/deploy.sh; the first also drives the frontend's auto-expanded evening questionnaire
      via the FirstReminderHour output. The night's last call runs on its own half-hour schedule
      past these
  FirstMealHour:
    Type: Number
    Default: 11
    Description: Asia/Jerusalem hour by which the day's first meal is expected; from then on the
      frontend opens the tracker's meal inputs expanded on a day with nothing recorded
  MealGapHours:
    Type: Number
    Default: 4
    Description: Hours a day may go without a meal before the next one counts as overdue; once the
      most recent recorded meal is this far behind, the frontend opens the tracker's meal inputs
      expanded
  WeighInWeekday:
    Type: String
    AllowedValues: [SUN, MON, TUE, WED, THU, FRI, SAT]
    Default: THU
    Description: Day the weekly weigh-in reminder fires. Declared in config/app.json under
      weight.weigh_in; scripts/deploy.sh passes it here because an EventBridge cron expression is
      fixed at deploy time
  WeighInHour:
    Type: Number
    Default: 8
    Description: Asia/Jerusalem hour of the weekly weigh-in reminder, from the same config/app.json
      declaration as WeighInWeekday
  BotTokenParam:
    Type: String
    Default: /diet-tracker/telegram/bot-token
  ChatMapParam:
    Type: String
    Default: /diet-tracker/telegram/chat-map

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 30
    # JSON format is what activates the runtime-level filter; raise ApplicationLogLevel to INFO
    # to surface the request lines and delivery receipts the code emits.
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: WARN
    Environment:
      Variables:
        DAYS_TABLE: !Ref DaysTable
        MEALS_TABLE: !Ref MealsTable
        STATE_TABLE: !Ref NudgeStateTable
        WEIGHTS_TABLE: !Ref WeightsTable
        APP_CONFIG_PATH: /var/task/app.json
        BOT_TOKEN_PARAM: !Ref BotTokenParam
        CHAT_MAP_PARAM: !Ref ChatMapParam
        SES_SENDER: !Ref SesSender
        USER_POOL_ID: !Ref UserPoolId

Resources:
  DaysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

  MealsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

  NudgeStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S

  # Holds both item kinds of the weight log: one measurement per calendar day under its ISO date,
  # and the user's single target under the sort key "target", which sorts past every date.
  WeightsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}'
              audience:
                - !Ref UserPoolClientId
            IdentitySource: '$request.header.Authorization'

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      # CodeUri must sit on each function: cloudformation package rewrites only per-function
      # values and would otherwise upload the template's own directory.
      CodeUri: ../build/lambda
      Handler: handlers/api.handler
      Events:
        SubmitDay:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /days
        History:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /days
        GetDay:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /days/{date}
        DeleteDay:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /days/{date}
        AddMeal:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /meals
        UpdateMeal:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /meals/{date}/{id}
        DeleteMeal:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /meals/{date}/{id}
        GetWeight:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /weight
        RecordWeight:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /weight
        SetWeightTarget:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /weight/target
        DeleteWeight:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /weight/{date}
        SetNotifications:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /notifications
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DaysTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MealsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NudgeStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WeightsTable
        - !Ref NotifyPolicy

  NudgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../build/lambda
      Handler: handlers/nudge.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DaysTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MealsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NudgeStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WeightsTable
        - !Ref NotifyPolicy
        - Statement:
            - Effect: Allow
              Action: cognito-idp:ListUsers
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}'

  # Both functions alert users, so the SES/SSM grants live in one shared managed policy.
  NotifyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesSender}'
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/diet-tracker/*'
          - Effect: Allow
            Action: kms:Decrypt
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-nudge
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt NudgeFunction.Arn

  ReminderSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: !Sub 'cron(0 ${ReminderHours} * * ? *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "reminder"}'

  LastCallSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      # Half past eleven is the last slot at which the day being asked about is still the running
      # one, so it carries its own minute rather than joining the whole-hour ReminderHours.
      ScheduleExpression: 'cron(30 23 * * ? *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "last_call"}'

  NightlyRulesSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: 'cron(30 23 * * ? *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "rules"}'

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: 'cron(0 8 ? * SUN *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "weekly"}'

  WeighInSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: !Sub 'cron(0 ${WeighInHour} ? * ${WeighInWeekday} *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "weigh_in"}'

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed CachingOptimized policy; invalidation on every frontend sync.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  FirstMealHour:
    Value: !Ref FirstMealHour
  FirstReminderHour:
    Value: !Select [0, !Split [',', !Ref ReminderHours]]
  FrontendBucket:
    Value: !Ref FrontendBucket
  FrontendUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  MealGapHours:
    Value: !Ref MealGapHours
  DistributionId:
    Value: !Ref Distribution
