AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: diet-tracker - API, storage, nudge scheduling, and frontend hosting.

Parameters:
  UserPoolId:
    Type: String
  UserPoolClientId:
    Type: String
  SesSender:
    Type: String
    Description: Verified SES identity used as the From address
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: 'http://localhost:8000'
  FirstMealHour:
    Type: Number
    Default: 11
    Description: Asia/Jerusalem hour by which the day's first meal is expected; a day still
      holding nothing past it carries an overdue meal. Read by the frontend through its
      generated config
  MealGapHours:
    Type: Number
    Default: 4
    Description: Hours a day may go without a meal before the next one counts as overdue,
      measured from when the most recent meal was eaten. Read by the frontend through its
      generated config
  WeighInWeekday:
    Type: String
    AllowedValues: [SUN, MON, TUE, WED, THU, FRI, SAT]
    Default: THU
    Description: Day the weekly weigh-in reminder fires, and the night the weekly recap goes out
      on so it reads that morning's weight. Declared in config/app.json under weight.weigh_in;
      scripts/deploy.sh passes it here because an EventBridge cron expression is fixed at deploy
      time
  WeighInHour:
    Type: Number
    Default: 8
    Description: Asia/Jerusalem hour of the weekly weigh-in reminder, from the same config/app.json
      declaration as WeighInWeekday
  AdminEmail:
    Type: String
    Description: Address whose authenticated caller the API recognizes as the admin — the one
      account allowed the per-user activity listing; passed by scripts/deploy.sh from params.sh
  BotTokenParam:
    Type: String
    Default: /diet-tracker/telegram/bot-token
  ChatMapParam:
    Type: String
    Default: /diet-tracker/telegram/chat-map
  RagApiUrl:
    Type: String
    Default: ''
    Description: Base URL of the external Summaries.AI REST API answering corpus questions
      (its POST /rag/query route); passed by scripts/deploy.sh from params.sh. Chat questions
      fail until it is configured
  RagApiKeyParam:
    Type: String
    Default: /diet-tracker/rag/api-key
    Description: SSM parameter holding the Summaries.AI API key the chat proxy sends
  ChatDailyLimit:
    Type: Number
    Description: Questions a user may ask per day unless ChatDailyLimitOverrides names them —
      chat is the only feature that spends money per use, so this is the per-user cost ceiling;
      passed by scripts/deploy.sh from params.sh
  ChatDailyLimitOverrides:
    Type: String
    Description: JSON object mapping a user's email (lowercase) to a daily limit that replaces
      ChatDailyLimit for that user; passed by scripts/deploy.sh from params.sh

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 30
    # JSON format is what activates the runtime-level filter; raise ApplicationLogLevel to INFO
    # to surface the request lines and delivery receipts the code emits.
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: WARN
    Environment:
      Variables:
        DAYS_TABLE: !Ref DaysTable
        MEALS_TABLE: !Ref MealsTable
        STATE_TABLE: !Ref NudgeStateTable
        WEIGHTS_TABLE: !Ref WeightsTable
        APP_CONFIG_PATH: /var/task/app.json
        BOT_TOKEN_PARAM: !Ref BotTokenParam
        CHAT_MAP_PARAM: !Ref ChatMapParam
        SES_SENDER: !Ref SesSender
        APP_URL: !Sub 'https://${Distribution.DomainName}'
        USER_POOL_ID: !Ref UserPoolId
        CHAT_QUOTA_TABLE: !Ref ChatQuotaTable
        CHAT_HISTORY_TABLE: !Ref ChatHistoryTable
        UNDELIVERED_TABLE: !Ref UndeliveredTable
        CHAT_DAILY_LIMIT: !Ref ChatDailyLimit
        CHAT_DAILY_LIMIT_OVERRIDES: !Ref ChatDailyLimitOverrides
        RAG_API_URL: !Ref RagApiUrl
        RAG_API_KEY_PARAM: !Ref RagApiKeyParam
        WEEKLY_RECAP_QUEUE_URL: !Ref WeeklyRecapQueue

Resources:
  DaysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

  MealsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

  NudgeStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S

  # One item per user per day ('{sub}#{day}') counting chat questions; the TTL attribute lets
  # DynamoDB delete yesterday's rows on its own, so there is no reset logic and no cleanup job.
  ChatQuotaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # One item per answered chat turn, keyed by user sub with the answer's UTC timestamp as the
  # sort key. No TTL: the transcript is deliberately kept indefinitely. A shared chat carries a
  # visibility attribute ("public" so far) that the index is keyed by over the same timestamp,
  # so the chats under one visibility are one query across every user; private chats carry
  # none and never enter it.
  ChatHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: visibility
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: ChatsByVisibility
          KeySchema:
            - AttributeName: visibility
              KeyType: HASH
            - AttributeName: sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # One item per message SES refused to deliver, keyed by the recipient's sub with the UTC
  # timestamp of the refusal as the sort key. No TTL: an item lives until its recipient dismisses
  # it, so nothing drops a message the recipient has not accounted for.
  UndeliveredTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

  # Holds both item kinds of the weight log: one measurement per calendar day under its ISO date,
  # and the user's single target under the sort key "target", which sorts past every date.
  WeightsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}'
              audience:
                - !Ref UserPoolClientId
            IdentitySource: '$request.header.Authorization'

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      # CodeUri must sit on each function: cloudformation package rewrites only per-function
      # values and would otherwise upload the template's own directory.
      CodeUri: ../build/lambda
      Handler: handlers/api.handler
      Environment:
        Variables:
          ADMIN_EMAIL: !Ref AdminEmail
      Events:
        SubmitDay:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /days
        History:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /days
        GetDay:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /days/{date}
        DeleteDay:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /days/{date}
        AddMeal:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /meals
        UpdateMeal:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /meals/{date}/{id}
        DeleteMeal:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /meals/{date}/{id}
        GetWeight:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /weight
        RecordWeight:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /weight
        SetWeightTarget:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /weight/target
        DeleteWeight:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /weight/{date}
        SetNotifications:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /notifications
        AdminActivity:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /admin/activity
        DismissUndelivered:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /undelivered/{at}
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DaysTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MealsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NudgeStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WeightsTable
        # The app reads the refused messages and dismisses them; recording one belongs to the
        # nudge job alone, and no managed policy spans read and delete without write.
        - DynamoDBCrudPolicy:
            TableName: !Ref UndeliveredTable
        # Read-only: the admin activity listing only counts stored chat turns.
        - DynamoDBReadPolicy:
            TableName: !Ref ChatHistoryTable
        - !Ref ListUsersPolicy
        # Every history read reports whether SES will deliver to the account's address — the
        # sandbox refuses every message to an address that has not confirmed its verification
        # request. The reading is stored beside the account's nudge state and refreshed only once
        # it has aged out, since SES rate-limits the lookup account-wide. The action takes no
        # resource-level grant.
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: ses:GetIdentityVerificationAttributes
              Resource: '*'

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../build/lambda
      Handler: handlers/chat.handler
      Environment:
        Variables:
          ADMIN_EMAIL: !Ref AdminEmail
      Events:
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /chat
        ChatTranscript:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /chat
        ChatSummary:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /chat/{at}/summary
        ChatDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /chat/{at}
        ChatSourceUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /chat/source-url
        ChatShare:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /chat/{at}/visibility
        ChatUnshare:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /chat/{at}/visibility
        ChatPublic:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /chat/public
        ChatCount:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /chat/count
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatQuotaTable
        # The grant covers the table's indexes, which the public listing queries.
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatHistoryTable
        # The public listing names each asker by the address the pool holds.
        - !Ref ListUsersPolicy
        # Read-only: the chat only attaches the asker's tracked data to the upstream question.
        - DynamoDBReadPolicy:
            TableName: !Ref DaysTable
        - DynamoDBReadPolicy:
            TableName: !Ref MealsTable
        - DynamoDBReadPolicy:
            TableName: !Ref WeightsTable
        - !Ref NotifyPolicy

  NudgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../build/lambda
      Handler: handlers/nudge.handler
      # Every job loops the whole user pool inside one invocation, sending per user, so the budget
      # scales with the pool rather than with one request — the global 30s cannot cover it. The
      # weekly job only queues, one message per user; its waits are spent by WeeklyRecapFunction.
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DaysTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MealsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NudgeStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WeightsTable
        # Write-only: the job keeps a message SES refused and never reads one back.
        - DynamoDBWritePolicy:
            TableName: !Ref UndeliveredTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt WeeklyRecapQueue.QueueName
        - !Ref NotifyPolicy
        - !Ref ListUsersPolicy

  # The weekly job's hand-off: one message per pool member, answered by WeeklyRecapFunction in an
  # invocation of its own, so a slow reading of one user's week delays no one else and a crash
  # takes one user with it.
  WeeklyRecapQueue:
    Type: AWS::SQS::Queue
    Properties:
      # How long a received message stays hidden from every other receiver. It has to outlast the
      # gap between Lambda's receive and its delete — the poller's own invoke retries while the
      # function is at its concurrency cap, then the run itself — or a second invocation would
      # start on the same user mid-run; six times the consumer's timeout is AWS's margin for
      # that. A failed message reappears when it runs out, so it is also the wait before the
      # next attempt.
      VisibilityTimeout: 540
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WeeklyRecapDeadLetterQueue.Arn
        # A crash is a bug to look at, not a transient to retry through: the consumer already
        # absorbs a failed reading and a failed send. So the message goes straight to the
        # dead-letter queue, where the user's sub and night wait to be redriven by hand once the
        # cause is fixed; the rerun finds the chat the crashed run stored and answers it.
        maxReceiveCount: 1

  # Holds a crashed user's message for the two weeks SQS allows at most — long enough that the
  # following week's run has made it moot.
  WeeklyRecapDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  WeeklyRecapFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../build/lambda
      Handler: handlers/nudge.recap_handler
      # One user's recap: the answering service's wait (RECAP_TIMEOUT_SECONDS, 55s) plus the
      # reads and the send around it.
      Timeout: 90
      Events:
        Recap:
          Type: SQS
          Properties:
            Queue: !GetAtt WeeklyRecapQueue.Arn
            # One user per invocation, so a crash requeues no one else and no partial-batch
            # bookkeeping is needed.
            BatchSize: 1
            # Two readings in flight at most, the lowest SQS allows: the answering service's API
            # key admits one request a second with a burst of five, and each reading holds its
            # request for seconds.
            ScalingConfig:
              MaximumConcurrency: 2
      Policies:
        # A recap reads the user's week and the tracked data the question's context block
        # carries: days, meals, weights and target.
        - DynamoDBReadPolicy:
            TableName: !Ref DaysTable
        - DynamoDBReadPolicy:
            TableName: !Ref MealsTable
        - DynamoDBReadPolicy:
            TableName: !Ref WeightsTable
        # Storing the answered follow-up replaces the recap chat in one transaction, a delete and
        # a put, so the grant is the full CRUD template.
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatHistoryTable
        # Write-only: a message SES refuses is kept for the app and never read back.
        - DynamoDBWritePolicy:
            TableName: !Ref UndeliveredTable
        - !Ref NotifyPolicy

  # The right to enumerate the user pool, shared by the nudge job (its recipients) and the API's
  # admin activity listing.
  ListUsersPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: cognito-idp:ListUsers
            Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}'

  # The SES/SSM grants shared by every function that alerts users or reads a secret from the
  # /diet-tracker/* SSM namespace (the chat proxy's RAG API key lives there too).
  NotifyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            # While the account sits in the SES sandbox every send is authorized against the
            # recipient's identity as well as the sender's, so a grant naming only SesSender denies
            # every message to anyone but the sender. The grant spans the account's own verified
            # identities, which is exactly the audience the sandbox permits as recipients.
            Action: ses:SendEmail
            Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/diet-tracker/*'
          - Effect: Allow
            Action: kms:Decrypt
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-nudge
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt NudgeFunction.Arn

  # An open day is nudged twice each evening: an early call at ten, and a last call at half past
  # eleven — the final slot at which the day being asked about is still the running one, so what
  # gets recorded is the day the user is living. A day closed between the two is only nudged once.
  EarlyCallSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: 'cron(0 22 * * ? *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "last_call"}'

  LastCallSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: 'cron(30 23 * * ? *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "last_call"}'

  # Fires on the weigh-in night so the recap reads the morning's fresh weight. The job reads the
  # seven days ending yesterday, so the week it reports closes the day before the weighing, and
  # that last day's own close window (day_close.close_until, 02:00) shut this morning.
  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: !Sub 'cron(45 23 ? * ${WeighInWeekday} *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "weekly"}'

  WeighInSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: !Sub 'cron(0 ${WeighInHour} ? * ${WeighInWeekday} *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "weigh_in"}'

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed CachingOptimized policy; invalidation on every frontend sync.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  FirstMealHour:
    Value: !Ref FirstMealHour
  FrontendBucket:
    Value: !Ref FrontendBucket
  FrontendUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  MealGapHours:
    Value: !Ref MealGapHours
  DistributionId:
    Value: !Ref Distribution
