AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: diet-tracker - API, storage, nudge scheduling, and frontend hosting.

Parameters:
  UserPoolId:
    Type: String
  UserPoolClientId:
    Type: String
  SesSender:
    Type: String
    Description: Verified SES identity used as the From address
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: 'http://localhost:8000'
  BotTokenParam:
    Type: String
    Default: /diet-tracker/telegram/bot-token
  ChatMapParam:
    Type: String
    Default: /diet-tracker/telegram/chat-map

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        QUESTIONNAIRE_PATH: /var/task/questionnaire.json
        BOT_TOKEN_PARAM: !Ref BotTokenParam
        CHAT_MAP_PARAM: !Ref ChatMapParam
        SES_SENDER: !Ref SesSender
        USER_POOL_ID: !Ref UserPoolId

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}'
              audience:
                - !Ref UserPoolClientId
            IdentitySource: '$request.header.Authorization'

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      # CodeUri must sit on each function: cloudformation package rewrites only per-function
      # values and would otherwise upload the template's own directory.
      CodeUri: ../build/lambda
      Handler: handlers/api.handler
      Events:
        Submit:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /answers
        History:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /answers
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /answers/{date}
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - !Ref NotifyPolicy

  NudgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../build/lambda
      Handler: handlers/nudge.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - !Ref NotifyPolicy
        - Statement:
            - Effect: Allow
              Action: cognito-idp:ListUsers
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}'

  # Both functions alert users, so the SES/SSM grants live in one shared managed policy.
  NotifyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesSender}'
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/diet-tracker/*'
          - Effect: Allow
            Action: kms:Decrypt
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-nudge
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt NudgeFunction.Arn

  ReminderSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: 'cron(0 20,22 * * ? *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "reminder"}'

  NightlyRulesSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: 'cron(30 23 * * ? *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "rules"}'

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: 'cron(0 8 ? * SUN *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "weekly"}'

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed CachingOptimized policy; invalidation on every frontend sync.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  FrontendBucket:
    Value: !Ref FrontendBucket
  FrontendUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  DistributionId:
    Value: !Ref Distribution
