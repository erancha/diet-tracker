AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: diet-tracker - API, storage, nudge scheduling, and frontend hosting.

Parameters:
  UserPoolId:
    Type: String
  UserPoolClientId:
    Type: String
  SesSender:
    Type: String
    Description: Verified SES identity used as the From address
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: 'http://localhost:8000'
  FirstMealHour:
    Type: Number
    Default: 11
    Description: Asia/Jerusalem hour by which the day's first meal is expected; a day still
      holding nothing past it carries an overdue meal. Read by the frontend through its
      generated config
  MealGapHours:
    Type: Number
    Default: 4
    Description: Hours a day may go without a meal before the next one counts as overdue,
      measured from when the most recent meal was eaten. Read by the frontend through its
      generated config
  WeighInWeekday:
    Type: String
    AllowedValues: [SUN, MON, TUE, WED, THU, FRI, SAT]
    Default: THU
    Description: Day the weekly weigh-in reminder fires. Declared in config/app.json under
      weight.weigh_in; scripts/deploy.sh passes it here because an EventBridge cron expression is
      fixed at deploy time
  WeighInHour:
    Type: Number
    Default: 8
    Description: Asia/Jerusalem hour of the weekly weigh-in reminder, from the same config/app.json
      declaration as WeighInWeekday
  AdminEmail:
    Type: String
    Description: Address whose authenticated caller the API recognizes as the admin — the one
      account allowed the per-user activity listing; passed by scripts/deploy.sh from params.sh
  BotTokenParam:
    Type: String
    Default: /diet-tracker/telegram/bot-token
  ChatMapParam:
    Type: String
    Default: /diet-tracker/telegram/chat-map
  RagApiUrl:
    Type: String
    Default: ''
    Description: Base URL of the external Summaries.AI REST API answering corpus questions
      (its POST /rag/query route); passed by scripts/deploy.sh from params.sh. Chat questions
      fail until it is configured
  RagApiKeyParam:
    Type: String
    Default: /diet-tracker/rag/api-key
    Description: SSM parameter holding the Summaries.AI API key the chat proxy sends
  ChatDailyLimit:
    Type: Number
    Description: Questions a user may ask per day unless ChatDailyLimitOverrides names them —
      chat is the only feature that spends money per use, so this is the per-user cost ceiling;
      passed by scripts/deploy.sh from params.sh
  ChatDailyLimitOverrides:
    Type: String
    Description: JSON object mapping a user's email (lowercase) to a daily limit that replaces
      ChatDailyLimit for that user; passed by scripts/deploy.sh from params.sh

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 30
    # JSON format is what activates the runtime-level filter; raise ApplicationLogLevel to INFO
    # to surface the request lines and delivery receipts the code emits.
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: WARN
    Environment:
      Variables:
        DAYS_TABLE: !Ref DaysTable
        MEALS_TABLE: !Ref MealsTable
        STATE_TABLE: !Ref NudgeStateTable
        WEIGHTS_TABLE: !Ref WeightsTable
        APP_CONFIG_PATH: /var/task/app.json
        BOT_TOKEN_PARAM: !Ref BotTokenParam
        CHAT_MAP_PARAM: !Ref ChatMapParam
        SES_SENDER: !Ref SesSender
        APP_URL: !Sub 'https://${Distribution.DomainName}'
        USER_POOL_ID: !Ref UserPoolId
        CHAT_QUOTA_TABLE: !Ref ChatQuotaTable
        CHAT_HISTORY_TABLE: !Ref ChatHistoryTable
        CHAT_DAILY_LIMIT: !Ref ChatDailyLimit
        CHAT_DAILY_LIMIT_OVERRIDES: !Ref ChatDailyLimitOverrides
        RAG_API_URL: !Ref RagApiUrl
        RAG_API_KEY_PARAM: !Ref RagApiKeyParam

Resources:
  DaysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

  MealsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

  NudgeStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S

  # One item per user per day ('{sub}#{day}') counting chat questions; the TTL attribute lets
  # DynamoDB delete yesterday's rows on its own, so there is no reset logic and no cleanup job.
  ChatQuotaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # One item per answered chat turn, keyed by user sub with the answer's UTC timestamp as the
  # sort key. No TTL: the transcript is deliberately kept indefinitely.
  ChatHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

  # Holds both item kinds of the weight log: one measurement per calendar day under its ISO date,
  # and the user's single target under the sort key "target", which sorts past every date.
  WeightsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}'
              audience:
                - !Ref UserPoolClientId
            IdentitySource: '$request.header.Authorization'

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      # CodeUri must sit on each function: cloudformation package rewrites only per-function
      # values and would otherwise upload the template's own directory.
      CodeUri: ../build/lambda
      Handler: handlers/api.handler
      Environment:
        Variables:
          ADMIN_EMAIL: !Ref AdminEmail
      Events:
        SubmitDay:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /days
        History:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /days
        GetDay:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /days/{date}
        DeleteDay:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /days/{date}
        AddMeal:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /meals
        UpdateMeal:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /meals/{date}/{id}
        DeleteMeal:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /meals/{date}/{id}
        GetWeight:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /weight
        RecordWeight:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /weight
        SetWeightTarget:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /weight/target
        DeleteWeight:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /weight/{date}
        SetNotifications:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /notifications
        AdminActivity:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /admin/activity
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DaysTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MealsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NudgeStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WeightsTable
        - !Ref ListUsersPolicy

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../build/lambda
      Handler: handlers/chat.handler
      Events:
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /chat
        ChatTranscript:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /chat
        ChatDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /chat/{at}
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatQuotaTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatHistoryTable
        # Read-only: the chat only attaches the asker's tracked data to the upstream question.
        - DynamoDBReadPolicy:
            TableName: !Ref DaysTable
        - DynamoDBReadPolicy:
            TableName: !Ref MealsTable
        - !Ref NotifyPolicy

  NudgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../build/lambda
      Handler: handlers/nudge.handler
      # The weekly job asks the RAG service for a per-user recap, and each call may run up to the
      # client's 25s ceiling — the global 30s budget cannot cover a loop over the user pool.
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DaysTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MealsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NudgeStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WeightsTable
        - !Ref NotifyPolicy
        - !Ref ListUsersPolicy

  # The right to enumerate the user pool, shared by the nudge job (its recipients) and the API's
  # admin activity listing.
  ListUsersPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: cognito-idp:ListUsers
            Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}'

  # The SES/SSM grants shared by every function that alerts users or reads a secret from the
  # /diet-tracker/* SSM namespace (the chat proxy's RAG API key lives there too).
  NotifyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            # While the account sits in the SES sandbox every send is authorized against the
            # recipient's identity as well as the sender's, so a grant naming only SesSender denies
            # every message to anyone but the sender. The grant spans the account's own verified
            # identities, which is exactly the audience the sandbox permits as recipients.
            Action: ses:SendEmail
            Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/diet-tracker/*'
          - Effect: Allow
            Action: kms:Decrypt
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-nudge
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt NudgeFunction.Arn

  LastCallSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      # Half past eleven is the last slot at which the day being asked about is still the running
      # one — late enough to be the day's single fill nudge, and still inside the day it asks about.
      ScheduleExpression: 'cron(30 23 * * ? *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "last_call"}'

  NightlyRulesSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: 'cron(30 23 * * ? *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "rules"}'

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: 'cron(0 8 ? * SUN *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "weekly"}'

  WeighInSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: !Sub 'cron(0 ${WeighInHour} ? * ${WeighInWeekday} *)'
      ScheduleExpressionTimezone: Asia/Jerusalem
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt NudgeFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "weigh_in"}'

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed CachingOptimized policy; invalidation on every frontend sync.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  FirstMealHour:
    Value: !Ref FirstMealHour
  FrontendBucket:
    Value: !Ref FrontendBucket
  FrontendUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  MealGapHours:
    Value: !Ref MealGapHours
  DistributionId:
    Value: !Ref Distribution
