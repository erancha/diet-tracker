AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cognito user pool with Google sign-in, gated by a pre-signup allowlist regex,
  with the admin emailed about each new user.

Parameters:
  GoogleClientId:
    Type: String
  GoogleClientSecret:
    Type: String
    NoEcho: true
  AllowedEmails:
    Type: String
    Description: Regex a Google account's email must fullmatch to sign up; alternation lists
      several addresses and ".*" opens sign-up to everyone
  AdminEmail:
    Type: String
    Description: Address notified about each new user who signs up
  SesSender:
    Type: String
    Description: Verified SES identity the new-user notice is sent from
  CallbackUrls:
    Type: CommaDelimitedList
    Default: 'http://localhost:8000/'
  DomainPrefix:
    Type: String
    Default: diet-trk

Resources:
  PreSignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../build/lambda
      Handler: handlers/presignup.handler
      Runtime: python3.13
      Architectures: [arm64]
      Timeout: 5
      Environment:
        Variables:
          ALLOWED_EMAILS: !Ref AllowedEmails
          ADMIN_EMAIL: !Ref AdminEmail
          SES_SENDER: !Ref SesSender
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              # While the account sits in the SES sandbox every send is authorized against the
              # recipient's identity as well as the sender's, so a grant naming only SesSender
              # denies every message to anyone but the sender. The grant spans the account's own
              # verified identities, which is exactly the audience the sandbox permits.
              Action: ses:SendEmail
              Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-UserPool'
      AliasAttributes: [email]
      AutoVerifiedAttributes: [email]
      LambdaConfig:
        PreSignUp: !GetAtt PreSignupFunction.Arn
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
        - Name: name
          AttributeDataType: String
          Mutable: true

  PreSignupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PreSignupFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  GoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId: !Ref UserPool
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: 'openid email profile'
      AttributeMapping:
        email: email
        name: name
        username: sub

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${DomainPrefix}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleProvider
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders: [Google]
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref CallbackUrls
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [openid, email, profile]

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  HostedUiDomain:
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
