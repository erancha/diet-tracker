name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the python3.13 Lambda runtime in scripts/template.yaml — CI proves what ships.
          python-version: "3.13"
      # scripts/test.sh is the same entry point developers use locally, so CI and local
      # verification cannot drift. It provisions its own virtualenv and runs the pytest suite.
      - name: Backend tests
        run: bash scripts/test.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      # `npm run build` runs tsc before vite, so this covers both typecheck and production build.
      - name: Frontend build
        run: npm run build
